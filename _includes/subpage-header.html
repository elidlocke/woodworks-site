{% if page.header_image %}
<!-- Compact header with a photo of the work (service pages) -->
<section id="service-header">
  <div class="container">
    <div class="row">
      <div class="col-xs-12 col-md-10 col-md-offset-1">
        <div class="service-header-inner">
          <div class="service-header-text">
            <h1>{{ page.title }}</h1>
            {% if page.subtitle %}
            <p>{{ page.subtitle }}</p>
            {% endif %}
          </div>
          <img class="service-header-photo" src="{{ page.header_image }}" alt="{{ page.header_alt }}" width="500" height="500">
        </div>
      </div>
    </div>
  </div>
</section>
{% else %}
<!-- Slider Start -->
<section id="global-header">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="block">
          <h1>{{ page.title }}</h1>
          {% if page.subtitle %}
          <p>{{ page.subtitle }}</p>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</section>
{% endif %}
